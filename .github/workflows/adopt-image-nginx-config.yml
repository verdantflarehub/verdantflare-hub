# One-time switch: stop overriding the Hub image's nginx config with the
# verdantflare-hub-nginx ConfigMap, so docker/nginx.conf in this repo is the only
# gateway config and ships with each image.
# Refuses unless production runs the expected image, that image carries exactly
# this commit's docker/nginx.conf, and the ConfigMap mount is the one expected.
# Rolls back to the previous Deployment revision if Hub is not ready or the
# public smoke checks fail. The ConfigMap object is kept so a rollback still works.
name: adopt-image-nginx-config

on:
  workflow_dispatch:
    inputs:
      expected_image:
        description: full image currently in production, e.g. ghcr.io/verdantflarehub/verdantflare-hub:hub-v1.7.27
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: verdantflare-hub-release
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    steps:
      - name: Require the dev branch
        run: test "$GITHUB_REF" = refs/heads/dev

      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require the expected image to carry this commit's nginx config
        env:
          IMAGE: ${{ inputs.expected_image }}
        run: |
          set -eu
          printf '%s' "$IMAGE" | grep -Eqx 'ghcr\.io/verdantflarehub/verdantflare-hub:hub-v[0-9]+\.[0-9]+\.[0-9]+'
          want="$(sha256sum docker/nginx.conf | cut -d' ' -f1)"
          got="$(docker run --rm --entrypoint cat "$IMAGE" /etc/nginx/conf.d/default.conf | sha256sum | cut -d' ' -f1)"
          echo "repo=$want image=$got"
          test "$want" = "$got"
          echo "CONFIG_SHA256=$want" >> "$GITHUB_ENV"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        env:
          KUBERNETES_SERVER: ${{ secrets.KUBERNETES_SERVER }}
          KUBERNETES_TOKEN: ${{ secrets.KUBERNETES_TOKEN }}
          KUBERNETES_CA: ${{ secrets.KUBERNETES_CA }}
        run: |
          set -eu
          test -n "$KUBERNETES_SERVER"
          test -n "$KUBERNETES_TOKEN"
          if [ "$KUBERNETES_SERVER" != 'https://kubernetes.verdantflare.ai' ]; then
            echo 'Refusing: Kubernetes API is not the current Center production endpoint' >&2
            exit 1
          fi
          if [ -n "$KUBERNETES_CA" ]; then
            ca_file="$RUNNER_TEMP/kubernetes-ca.crt"
            printf '%s\n' "$KUBERNETES_CA" > "$ca_file"
            kubectl config set-cluster verdantflare --server="$KUBERNETES_SERVER" --certificate-authority="$ca_file" --embed-certs=true
          else
            kubectl config set-cluster verdantflare --server="$KUBERNETES_SERVER"
          fi
          kubectl config set-credentials github-actions --token="$KUBERNETES_TOKEN"
          kubectl config set-context verdantflare --cluster=verdantflare --user=github-actions --namespace=verdantflare

      - name: Refuse unless production is in the expected state
        env:
          EXPECTED: ${{ inputs.expected_image }}
        run: |
          set -eu
          k() { kubectl --context verdantflare -n verdantflare "$@"; }
          k get deployment verdantflare-hub -o json > "$RUNNER_TEMP/hub-before.json"
          jq -e --arg image "$EXPECTED" '
            .spec.template.spec as $s
            | ($s.containers | length) == 1
            and $s.containers[0].name == "verdantflare-hub"
            and $s.containers[0].image == $image
            and ($s.containers[0].volumeMounts | length) == 1
            and $s.containers[0].volumeMounts[0] == {"mountPath":"/etc/nginx/conf.d/default.conf","name":"nginx-config","readOnly":true,"subPath":"default.conf"}
            and ($s.volumes | length) == 1
            and $s.volumes[0].name == "nginx-config"
            and $s.volumes[0].configMap.name == "verdantflare-hub-nginx"' "$RUNNER_TEMP/hub-before.json"
          k rollout status deployment/verdantflare-hub --timeout=60s

      - name: Remove the ConfigMap mount, roll back if Hub is not healthy
        run: |
          set -eu
          k() { kubectl --context verdantflare -n verdantflare "$@"; }
          rollback() {
            echo "$1; rolling back to the previous revision" >&2
            k rollout undo deployment/verdantflare-hub
            k rollout status deployment/verdantflare-hub --timeout=5m
            exit 1
          }
          k patch deployment verdantflare-hub --type json -p '[
            {"op":"test","path":"/spec/template/spec/containers/0/volumeMounts/0/name","value":"nginx-config"},
            {"op":"test","path":"/spec/template/spec/volumes/0/name","value":"nginx-config"},
            {"op":"remove","path":"/spec/template/spec/containers/0/volumeMounts"},
            {"op":"remove","path":"/spec/template/spec/volumes"}]'
          k rollout status deployment/verdantflare-hub --timeout=5m || rollback 'Hub did not become ready'

          live="$(k exec deployment/verdantflare-hub -c verdantflare-hub -- sha256sum /etc/nginx/conf.d/default.conf | cut -d' ' -f1)"
          echo "live config sha256=$live"
          [ "$live" = "$CONFIG_SHA256" ] || rollback 'Live config is not the image config'
          k exec deployment/verdantflare-hub -c verdantflare-hub -- nginx -t || rollback 'nginx -t failed in the pod'

          base=https://hub.verdantflare.ai
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          head -c 1300000 /dev/zero > "$RUNNER_TEMP/body.bin"
          [ "$(code "$base/")" = 200 ] || rollback 'Home page is not 200'
          [ "$(code --data-binary @"$RUNNER_TEMP/body.bin" "$base/api/control/ops/v2/apps")" = 401 ] || rollback '1.3 MB unauthenticated request is not 401'
          [ "$(code -X POST -H 'Content-Type: application/json' -d '{}' "$base/mcp")" = 401 ] || rollback '/mcp without token is not 401'
          curl -sI "$base/agent-handoff" | grep -qi "content-security-policy: default-src 'none'" || rollback 'agent-handoff lacks its CSP'
          echo 'Hub now serves the image nginx config; ConfigMap verdantflare-hub-nginx is kept only for rollback.'
          k get deployment verdantflare-hub -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
