# Single source of the Hub gateway: baked into the image and deployed with it.
# Production no longer overrides it with a ConfigMap. Regression: docker/nginx_test.py.
limit_req_zone $binary_remote_addr zone=survey_public:1m rate=5r/s;

map $http_x_forwarded_proto $vf_credential_proto {
  default $scheme;
  https https;
}

server {
  listen 8087;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # auth_request checks the parent request body against this location's limit,
  # so it must match the largest authenticated body (/api/control/, 2m);
  # otherwise nginx turns the subrequest's 413 into a 500.
  location = /_auth/session {
    internal;
    client_max_body_size 2m;
    proxy_pass http://verdantflare-login-api.verdantflare.svc.cluster.local:8088/api/auth/session;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
  }

  location ^~ /api/control/public/surveys/ {
    client_max_body_size 64k;
    limit_req zone=survey_public burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://verdantflare-service-control.verdantflare.svc.cluster.local:8080/api/control/public/surveys/;
    proxy_set_header Host $host;
    proxy_set_header X-VF-Login-Subject "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hub Market MCP for AI tools: bearer token only, never the Login session.
  location = /mcp {
    client_max_body_size 5m;
    proxy_pass http://verdantflare-service-control.verdantflare.svc.cluster.local:8080/api/control/mcp;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-VF-Login-Subject "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Skill publishing MCP: a separate MCP server for skill_publish tokens only.
  # Bearer only, no Hub session; Control registers from GitHub within 40 s,
  # inside the default 60 s proxy_read_timeout.
  location = /skill-publishing/mcp {
    client_max_body_size 64k;
    proxy_pass http://verdantflare-service-control.verdantflare.svc.cluster.local:8080/api/control/skill-publishing/mcp;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-VF-Login-Subject "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # One-time supplier credential upload uses MCP bearer auth, not Login cookies.
  location ^~ /api/control/mcp/credentials/ {
    client_max_body_size 2k;
    proxy_pass http://verdantflare-service-control.verdantflare.svc.cluster.local:8080;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-VF-Login-Subject "";
    proxy_set_header X-Forwarded-Proto $vf_credential_proto;
  }

  location ^~ /api/control/station/v2/ {
    client_max_body_size 64k;
    proxy_pass http://verdantflare-service-control.verdantflare.svc.cluster.local:8080/api/control/station/v2/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-VF-Login-Subject "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/control/ {
    client_max_body_size 2m;
    auth_request /_auth/session;
    auth_request_set $login_subject $upstream_http_x_vf_login_subject;
    proxy_pass http://verdantflare-service-control.verdantflare.svc.cluster.local:8080/api/control/;
    proxy_set_header Host $host;
    proxy_set_header X-VF-Login-Subject $login_subject;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The handoff fragment is read by this page only; constrain same-origin script
  # execution and prevent referrer leakage from the confirmation surface.
  location = /agent-handoff {
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; base-uri 'none'; object-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|webp|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
