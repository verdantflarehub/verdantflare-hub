# ADMIN CONFIG REQUIRED:
# Configure KUBERNETES_* repository secrets. Before the first release,
# create the verdantflare-hub Deployment in the verdantflare namespace.
name: build

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/verdantflarehub/verdantflare-hub
  VERSION: ${{ github.ref == 'refs/heads/dev' && 'hub-v1.7.17-dev.1' || 'hub-v1.7.17' }}

concurrency:
  group: verdantflare-hub-release
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push Hub image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build html
        env:
          VITE_USE_MOCK: "false"
          VITE_CONTROL_API_BASE: /api/control
          VITE_LOGIN_URL: ${{ github.ref == 'refs/heads/dev' && 'https://login.dev.verdantflarehub.com/sign-in' || 'https://login.verdantflare.ai/sign-in' }}
          VITE_WWW_URL: ${{ github.ref == 'refs/heads/dev' && 'https://www.dev.verdantflarehub.com' || 'https://www.verdantflare.ai' }}
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing image tag
        run: '! docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:${{ env.VERSION }}" >/dev/null 2>&1'

      - name: Build and push Hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          build-args: |
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image build success
        run: |
          echo "${{ env.IMAGE_NAME }}:${VERSION} built and pushed."

  deploy:
    name: Deploy Hub to Kubernetes
    needs: build-and-push
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        env:
          KUBERNETES_SERVER: ${{ secrets.KUBERNETES_SERVER }}
          KUBERNETES_TOKEN: ${{ secrets.KUBERNETES_TOKEN }}
          KUBERNETES_CA: ${{ secrets.KUBERNETES_CA }}
        run: |
          set -eu
          test -n "$KUBERNETES_SERVER"
          test -n "$KUBERNETES_TOKEN"

          if [ -n "$KUBERNETES_CA" ]; then
            ca_file="$RUNNER_TEMP/kubernetes-ca.crt"
            printf '%s\n' "$KUBERNETES_CA" > "$ca_file"
            kubectl config set-cluster verdantflare \
              --server="$KUBERNETES_SERVER" \
              --certificate-authority="$ca_file" \
              --embed-certs=true
          else
            kubectl config set-cluster verdantflare \
              --server="$KUBERNETES_SERVER"
          fi

          kubectl config set-credentials github-actions --token="$KUBERNETES_TOKEN"
          kubectl config set-context verdantflare \
            --cluster=verdantflare \
            --user=github-actions \
            --namespace=verdantflare

      - name: Configure GHCR pull secret and update Hub deployment
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          kubectl --context verdantflare -n verdantflare create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USER" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl --context verdantflare -n verdantflare apply -f -
          kubectl --context verdantflare -n verdantflare patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

          image="${IMAGE_NAME}:${VERSION}"
          kubectl --context verdantflare -n verdantflare set image deployment/verdantflare-hub verdantflare-hub="$image"
          kubectl --context verdantflare -n verdantflare rollout status deployment/verdantflare-hub --timeout=5m
          kubectl --context verdantflare -n verdantflare get deployment/verdantflare-hub \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="verdantflare-hub")].image}{"\n"}'
