<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VerdantFlare Hub — 应用、体验、API 与组织管理中心。" />
    <meta name="theme-color" content="#0b0f0c" />
    <script>
      (() => {
        let selected;
        try { selected = localStorage.getItem("verdantflare_theme"); } catch { /* storage may be unavailable */ }
        const theme = selected === "light" || selected === "dark"
          ? selected
          : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#eef2ef" : "#0b0f0c";
      })();
    </script>
    <link rel="icon" href="/brand/verdantflare-logo.png" type="image/png" />
    <title>VerdantFlare Hub</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
